services:
  acceding-titans-web:
    # Registry image: built on the dev PC, pushed to GHCR, VPS only pulls it.
    # `docker compose pull acceding-titans-web` downloads this; `build:` below
    # stays as a local fallback (never run `--build` on the VPS — 1.6GB RAM).
    image: ghcr.io/adetonamichael/accending-titans-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin mode: /api/v1 → nginx proxies to BACKEND_ORIGIN (no CORS).
        # Override in .env; these are fallbacks only.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://accedingtitans.com}
        NEXT_PUBLIC_VERBOSE_API_LOGGING: ${NEXT_PUBLIC_VERBOSE_API_LOGGING:-false}
    container_name: acceding-titans-web
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - webnet
    # Not published — only nginx reaches it on the internal network.
    # Uncomment for direct debugging:
    # ports:
    #   - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  acceding-titans-nginx:
    image: nginx:alpine
    container_name: acceding-titans-nginx
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      # Backend origin (scheme + host, no trailing path) for /api/ + /phpmyadmin/.
      # host.docker.internal resolves to the host via extra_hosts below.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://host.docker.internal:8005}
      BACKEND_HOST: ${BACKEND_HOST:-accedingtitans.com}
    # Lets the container reach host-published ports (backend nginx on 8005).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shadow the image's stock conf.d/default.conf — otherwise it becomes
      # the default server on port 80 and serves the nginx welcome page
      # instead of the SSL template's HTTP→HTTPS redirect.
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      # envsubst: templates/*.template → conf.d/
      - ./nginx/00-upstreams.conf.template:/etc/nginx/templates/00-upstreams.conf.template:ro
      - ./nginx/ssl.conf.template:/etc/nginx/templates/ssl.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - webnet
    depends_on:
      acceding-titans-web:
        condition: service_healthy
    healthcheck:
      # Port 80 always listens (ACME + redirect), so this works pre/post SSL.
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || nc -z 127.0.0.1 80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  webnet:
    driver: bridge

volumes:
  certbot-www:
